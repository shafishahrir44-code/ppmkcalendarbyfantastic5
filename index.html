<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PPMK Calendar - Built with ChatAndBuild</title>
    
    <!-- Meta tags -->
    <meta property="og:title" content="PPMK Calendar - Built with ChatAndBuild" />
    <meta property="og:description" content="Academic calendar system for PPMK institution with event management and collaboration features" />
    <meta property="og:image" content="https://cdn.chatandbuild.com/images/preview.png" />
    <meta property="keywords" content="no-code, app builder, conversation-driven development, academic calendar, institution, PPMK" />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="PPMK Calendar - Built with ChatAndBuild" />
    <meta property="twitter:description" content="Academic calendar system for PPMK institution with event management and collaboration features" />
    <meta property="twitter:image" content="https://cdn.chatandbuild.com/images/preview.png" />
    <meta property="twitter:site" content="@chatandbuild" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Playfair+Display:wght@400;700;900&family=Source+Serif+Pro:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Crimson Text', serif;
        background: linear-gradient(135deg, #0f0d0a, #1a1611, #2d2419, #1f1b14);
        background-size: 400% 400%;
        animation: subtleShift 15s ease infinite;
        overflow-x: hidden;
      }
      
      @keyframes subtleShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
      }
      
      .parchment-texture {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.08;
        background: 
          radial-gradient(circle at 20% 50%, rgba(139, 69, 19, 0.4) 0%, transparent 50%),
          radial-gradient(circle at 80% 20%, rgba(101, 67, 33, 0.4) 0%, transparent 50%),
          radial-gradient(circle at 40% 80%, rgba(160, 82, 45, 0.4) 0%, transparent 50%);
        z-index: 1;
      }
      
      .book-spine-bg {
        background-image: 
          linear-gradient(90deg, rgba(139, 69, 19, 0.15) 1px, transparent 1px),
          linear-gradient(rgba(101, 67, 33, 0.15) 1px, transparent 1px);
        background-size: 80px 20px;
        animation: bookMove 25s linear infinite;
      }
      
      @keyframes bookMove {
        0% { background-position: 0 0; }
        100% { background-position: 80px 20px; }
      }
      
      .academic-shadow {
        box-shadow: 
          0 8px 32px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(139, 69, 19, 0.3);
      }
      
      .parchment-border {
        border: 2px solid #8b4513;
        border-image: linear-gradient(45deg, #8b4513, #d2b48c, #8b4513) 1;
      }

      .logo-clean {
        border-radius: 50%;
        object-fit: cover;
        object-position: center;
        background: radial-gradient(circle, rgba(139, 69, 19, 0.1), transparent);
        border: 2px solid rgba(217, 119, 6, 0.3);
        box-shadow: 
          0 0 20px rgba(217, 119, 6, 0.2),
          inset 0 0 20px rgba(139, 69, 19, 0.1);
      }
    </style>
  </head>
  <body>
    <div class="parchment-texture"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
